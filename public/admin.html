<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Admin · wrench.repair</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 16px; color: #222; }
      a { color: #1a5fb4; }
      nav a { margin-right: 12px; }
      nav a.on { font-weight: bold; color: inherit; text-decoration: none; }
      table { border-collapse: collapse; width: 100%; font-size: 14px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
      th { background: #f4f4f4; position: sticky; top: 0; }
      tbody tr.click { cursor: pointer; }
      tbody tr.click:hover { background: #f7f9fc; }
      .muted { color: #777; font-size: 13px; }
      .num { text-align: right; white-space: nowrap; }
      .avatar { width: 24px; height: 24px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
      .tag { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; background: #eee; }
      .tag.red { background: #fde2e1; color: #a1251d; }
      .tag.yellow { background: #fdf2c7; color: #7a5b00; }
      .tag.green { background: #dff5e3; color: #1d6b31; }
      .msg { border-left: 4px solid #ddd; padding: 6px 10px; margin: 10px 0; }
      .msg.red { border-color: #e74c3c; }
      .msg.yellow { border-color: #f1c40f; }
      .msg p { margin: 4px 0; white-space: pre-wrap; }
      .convo { margin: 24px 0; }
      .convo h3 { font-size: 15px; margin: 0 0 4px; }
      .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 12px 0; }
      .stats div b { display: block; font-size: 18px; }
      .error { color: #a1251d; }
      .scroll { overflow-x: auto; }
    </style>
  </head>
  <body>
    <p>
      <a href="/">wrench.repair</a> &middot; <a href="/chat">Chat</a> &middot; Admin
    </p>
    <nav>
      <a href="#/" id="nav-users">Users</a>
      <a href="#/flagged" id="nav-flagged">Needs a look</a>
    </nav>
    <main id="main"><p>Loading...</p></main>

    <script>
      const main = document.getElementById("main");

      // Uses textContent, so user text is safe
      function el(tag, props = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (k === "class") node.className = v;
          else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
          else if (v !== undefined && v !== null) node[k] = v;
        }
        node.append(...children.flat().filter(c => c !== null && c !== undefined && c !== false));
        return node;
      }

      function ago(ms) {
        if (!ms) return el("span", { class: "muted" }, "never");
        const s = (Date.now() - ms) / 1000;
        const text =
          s < 60 ? "just now" :
          s < 3600 ? Math.floor(s / 60) + " min ago" :
          s < 86400 ? Math.floor(s / 3600) + " h ago" :
          Math.floor(s / 86400) + " d ago";
        return el("span", { title: new Date(ms).toLocaleString() }, text);
      }

      function flag(code) {
        if (!code || !/^[A-Z]{2}$/.test(code) || code === "XX") return "";
        return String.fromCodePoint(...[...code].map(c => 0x1f1e6 + c.charCodeAt(0) - 65)) + " " + code;
      }

      function problems(m, slowMs) {
        const list = [];
        if (m.error) list.push(["Error", "red"]);
        if (m.refused) list.push(["Refused", "yellow"]);
        if (m.ms > slowMs) list.push(["Slow", "yellow"]);
        if (m.rating === -1) list.push(["👎", "yellow"]);
        if (m.rating === 1) list.push(["👍", "green"]);
        return list;
      }

      async function api(path, options) {
        const res = await fetch("/api/admin" + path, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
        return data;
      }

      function showError(error) {
        main.replaceChildren(el("p", { class: "error" }, error.message));
        if (error.message === "Admins only.") {
          main.append(el("p", {}, "Sign in with an admin Google account on the ", el("a", { href: "/login" }, "login page"), "."));
        }
      }

      // Users list
      async function showUsers() {
        const { users } = await api("/users");
        if (!users.length) {
          main.replaceChildren(el("p", {}, "Nobody has signed in yet."));
          return;
        }

        const rows = users.map(u => el("tr", { class: "click", onclick: () => (location.hash = "#/user/" + encodeURIComponent(u.id)) },
          el("td", {},
            u.picture ? el("img", { class: "avatar", src: u.picture, alt: "", referrerPolicy: "no-referrer" }) : null,
            el("a", { href: "#/user/" + encodeURIComponent(u.id) }, u.name || "(no name)"),
            el("div", { class: "muted" }, u.email),
            u.blocked ? el("span", { class: "tag red" }, "Blocked") : null,
          ),
          el("td", { class: "num" }, String(u.message_count)),
          el("td", { class: "num" }, String(u.conversation_count)),
          el("td", { class: "num" }, Number(u.total_tokens).toLocaleString()),
          el("td", {}, ago(u.last_chat_at)),
          el("td", {}, ago(u.last_seen_at)),
          el("td", {}, u.last_ip || "", el("div", { class: "muted" }, flag(u.last_country))),
          el("td", {},
            u.error_count ? el("span", { class: "tag red" }, u.error_count + " errors") : null,
            u.refused_count ? el("span", { class: "tag yellow" }, u.refused_count + " refused") : null,
            u.thumbs_down_count ? el("span", { class: "tag yellow" }, u.thumbs_down_count + " 👎") : null,
          ),
        ));

        main.replaceChildren(
          el("p", { class: "muted" }, users.length + (users.length === 1 ? " user" : " users") + ". Click one to see their chats."),
          el("div", { class: "scroll" }, el("table", {},
            el("thead", {}, el("tr", {},
              ["User", "Messages", "Chats", "Tokens", "Last used AI", "Last seen", "Last IP", "Issues"]
                .map((h, i) => el("th", { class: i >= 1 && i <= 3 ? "num" : "" }, h)),
            )),
            el("tbody", {}, rows),
          )),
        );
      }

      // One message
      function messageBlock(m, slowMs, showUser) {
        const issues = problems(m, slowMs);
        const color = issues.some(([, c]) => c === "red") ? "red" : issues.some(([, c]) => c === "yellow") ? "yellow" : "";
        const meta = [
          new Date(m.created_at).toLocaleString(),
          m.total_tokens != null ? m.total_tokens + " tokens (" + m.input_tokens + " in / " + m.output_tokens + " out)" : null,
          m.ms != null ? (m.ms / 1000).toFixed(1) + "s" : null,
          m.ip ? m.ip + " " + flag(m.country) : null,
        ].filter(Boolean).join(" · ");

        return el("div", { class: "msg " + color },
          el("div", { class: "muted" },
            showUser ? el("a", { href: "#/user/" + encodeURIComponent(m.user_id) }, m.name || m.email) : null,
            showUser ? " · " : null,
            meta, " ",
            issues.map(([t, c]) => el("span", { class: "tag " + c }, t)),
          ),
          el("p", {}, el("b", {}, "User: "), m.text),
          m.error
            ? el("p", { class: "error" }, el("b", {}, "Error: "), m.error)
            : el("p", {}, el("b", {}, "AI: "), m.reply || "(empty)"),
        );
      }

      // One user
      async function showUser(id) {
        const { user: u, messages, slowMs } = await api("/users/" + encodeURIComponent(id));

        const blockButton = el("button", {
          onclick: async () => {
            const blocked = !u.blocked;
            if (blocked && !confirm("Block " + u.email + " from using the chat?")) return;
            blockButton.disabled = true;
            try {
              await api("/users/" + encodeURIComponent(id) + "/block", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ blocked }),
              });
              showUser(id);
            } catch (e) {
              alert(e.message);
              blockButton.disabled = false;
            }
          },
        }, u.blocked ? "Unblock" : "Block from chat");

        const tokens = messages.reduce((sum, m) => sum + (m.total_tokens || 0), 0);
        const count = (test) => messages.filter(test).length;

        const convos = new Map();
        for (const m of messages) {
          if (!convos.has(m.conversation_id)) convos.set(m.conversation_id, []);
          convos.get(m.conversation_id).push(m);
        }
        const convoBlocks = [...convos.values()].reverse().map((list, i, all) => el("div", { class: "convo" },
          el("h3", {}, "Chat " + (all.length - i) + " ",
            el("span", { class: "muted" }, "· " + new Date(list[0].created_at).toLocaleString() + " · " + list.length + (list.length === 1 ? " message" : " messages"))),
          list.map(m => messageBlock(m, slowMs, false)),
        ));

        main.replaceChildren(
          el("p", {}, el("a", { href: "#/" }, "← All users")),
          el("h2", {},
            u.picture ? el("img", { class: "avatar", src: u.picture, alt: "", referrerPolicy: "no-referrer" }) : null,
            u.name || "(no name)", " ",
            u.blocked ? el("span", { class: "tag red" }, "Blocked") : null,
          ),
          el("div", { class: "muted" }, u.email + " · Google ID " + u.id),
          el("div", { class: "stats" },
            el("div", {}, el("b", {}, String(messages.length)), "messages"),
            el("div", {}, el("b", {}, String(convos.size)), "chats"),
            el("div", {}, el("b", {}, tokens.toLocaleString()), "tokens"),
            el("div", {}, el("b", {}, String(count(m => m.error))), "errors"),
            el("div", {}, el("b", {}, String(count(m => m.refused))), "refused"),
            el("div", {}, el("b", {}, count(m => m.rating === 1) + " / " + count(m => m.rating === -1)), "👍 / 👎"),
          ),
          el("table", { style: "width: auto" }, el("tbody", {},
            el("tr", {}, el("th", {}, "First signed in"), el("td", {}, ago(u.created_at))),
            el("tr", {}, el("th", {}, "Last seen"), el("td", {}, ago(u.last_seen_at))),
            el("tr", {}, el("th", {}, "Last used AI"), el("td", {}, ago(u.last_chat_at))),
            el("tr", {}, el("th", {}, "Last IP"), el("td", {}, (u.last_ip || "unknown") + " " + flag(u.last_country))),
          )),
          el("p", {}, blockButton),
          ...(messages.length ? convoBlocks : [el("p", { class: "muted" }, "No messages yet.")]),
        );
      }

      // Needs a look
      async function showFlagged() {
        const { messages, slowMs } = await api("/flagged");
        main.replaceChildren(
          el("p", { class: "muted" },
            "Errors, refusals, replies slower than " + slowMs / 1000 + "s, and 👎 ratings. Newest first, last 200."),
          ...(messages.length ? messages.map(m => messageBlock(m, slowMs, true)) : [el("p", {}, "Nothing to look at. 🎉")]),
        );
      }

      // Routing
      async function route() {
        const hash = location.hash || "#/";
        document.getElementById("nav-users").classList.toggle("on", !hash.startsWith("#/flagged"));
        document.getElementById("nav-flagged").classList.toggle("on", hash.startsWith("#/flagged"));
        main.replaceChildren(el("p", {}, "Loading..."));
        try {
          if (hash.startsWith("#/user/")) await showUser(decodeURIComponent(hash.slice(7)));
          else if (hash.startsWith("#/flagged")) await showFlagged();
          else await showUsers();
        } catch (e) {
          showError(e);
        }
      }

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
