<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>My test page</title>
    <style>
        .wrapper {
            display: grid;
            border: 2px solid #f76707;
            background-color: #fff4e6;
            box-sizing: border-box;
            border-radius: 5px;
            gap: 10px;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(100px, auto);
            
        }

        .grid-item{
            
            border: 2px solid #f76707;
            padding: 20px;
            background-color: #fddbb0;
        }
    </style>
  </head>
  <body> 
    <form action = "/my-handling-form-page" method = "post">
        <p>
            <label for="make">Make:</label>
            <input type="text" id = "make" name = "user_make" />
        </p>
        <p>
            <label for="model">Model:</label>
            <input type="text" id = "model" name = "user_model" />

        </p>
        <p>
            <label for="msg">Year:</label>
            <input type="text" id = "year" name = "user_year"/>
        </p>
        <p>
            <label for="experience-levels"> 
                Select your experience level:                
            </label>
            <select>
                <option value="beginner">First-timer</option>
                <option value="intermediate">Home Handyman</option>
                <option value="advanced">Bona-fide mechanic</option>
            </select>
        </p>
        <p class="button">
            <button type="submit">Send your message!</button>
        </p>
    </form>

    <div class="wrapper">
        <div class = "grid-item">One</div>
        <div class = "grid-item">Two</div>
        <div class = "grid-item">Three</div>
        <div class = "grid-item">Four</div>
        <div class = "grid-item">Five</div>
    </div>
  </body>
</html>
