<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wrench.repair</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <style>
    html, body{
      height: 100%;
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }

    body {
      background: #cccccc; 
      margin: 0;
      min-height: 100vh;
      text-align: center;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      width: 100%;
      background: linear-gradient(135deg, #c258ff, #1babff);
    }

    .topbar .logo img {
      display: block;
      height: 40px;
      width: auto;
    }
    
    form {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 1em;
      border: 1px solid #cccccc;
      border-radius: 1em;
    }

    p + p{
      margin-top: 1em;
    }

    input, 
    textarea{
      font: 1em sans-serif;
      width: 300px;
      box-sizing: border-box;
    }
    
    input:focus, 
    textarea:focus{
      outline-style: solid;
      outline-color: white;
    }

    textarea{
      vertical-align: top;
      height: 5em;
    }
    .button {
      padding-left: 0;
      text-align: center;
    }

    button {
      margin-left: 0;
    }

  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">
      <img src="assets/logo-transparent.png" alt="wrench.repair">
    </a>
  </header>
  <form id = "chat-form"
    action = "/my-handling-form-page" method="post">
    <p>
      <label for="prompt">Prompt:</label>
      <input type="text" id="prompt" name="user_prompt" placeholder = "place ai prompts here"/>
    
    </p>
    <p class="button">
      <button type = "submit">BLOW UP RAMESES ROBERTS RICHARDS FOR FREE</button>

    </p>
    

  </form>
  <p id = "reply" role = "status"></p>
  <script>
  const form = document.getElementById("chat-form");
  const input = document.getElementById("prompt");
  const replyBox = document.getElementById("reply");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const prompt = input.value.trim();

    if (!prompt) {
      replyBox.textContent = "Please type a message.";
      return;
    }

    replyBox.textContent = "Sending...";

    try {
      // Send the typed message to your Worker.
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt })
      });

      // Read the Worker's response.
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }

      // Put its reply on the page.
      replyBox.textContent = data.reply;

    } catch (error) {
      replyBox.textContent = "Error: " + error.message;
    }
  });
</script>
</body>
</html>
