<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wrench.repair</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #c258ff, #1babff);
      margin: 0;
      min-height: 100vh;
      text-align: center;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    form {
      display: inline-block;
      padding: 1em;
      border: 1px solid #cccccc;
      border-radius: 1em;
    }

    p + p{
      margin-top: 1em;
    }

    input, 
    textarea{
      font: 1em sans-serif;
      width: 300px;
      box-sizing: border-box;
      border: 1px solid #cccccc;
    }
    
    input:focus, 
    textarea:focus{
      outline-style: solid;
      outline-color: white;
    }

    textarea{
      vertical-align: top;
      height: 5em;
    }
    .button {
      padding-left: 90px;
    }

    button {
      margin-left: 0.5em;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: linear-gradient(135deg, #c258ff, #1babff);
    }

    .topbar .logo img {
      display: block;
      height: 40px;
      width: auto;
    }

  </style>
</head>
<body>
  <form 
    action = "/my-handling-form-page" method="post">
    <p>
      <label for="name">Prompt:</label>
      <input type="text" id="prompt" name="user_prompt" value = "place ai prompts here"/>
    
    </p>
    <p class="button">
      <button type = "submit">BLOW UP RAMESES ROBERTS RICHARDS FOR FREE</button>

    </p>
    

  </form>
  <header class="topbar">
    <a class="logo" href="/">
      <img src="assets/logo-transparent.png" alt="wrench.repair">
    </a>
  </header>
</body>
</html>
